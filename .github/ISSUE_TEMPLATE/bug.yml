name: Bug report
description: Report reproducible incorrect behavior in MultiMeters
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, or private usage logs.
  - type: input
    id: version
    attributes:
      label: MultiMeters version
      placeholder: 0.2.10
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and concise reproduction steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Windows version and affected provider, if applicable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
